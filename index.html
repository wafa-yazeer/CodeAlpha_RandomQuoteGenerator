<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>little wisdom. | Random Quote Generator</title>
  <meta name="description" content="A minimal random quote app with favorites, your own quotes, card styles and image download.">
  <meta name="theme-color" content="#F2EFE9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6 -3.4"/><path d="M8.7 13.3l6.6 3.4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M17.7 5a9 9 0 0 1 0 14"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/><path d="M12 9v6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M18 7v14l-6 -4l-6 4v-14a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <h1 class="logo">little wisdom.</h1>
      <div class="topbar-actions">
        <button id="installBtn" class="install-btn" type="button" hidden>Install app</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch to dark mode">
          <svg class="ic"><use id="themeIcon" href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view is-active" aria-label="Random quote">
        <div class="chips" id="chips" role="group" aria-label="Quote category"></div>

        <article class="card" id="card" data-card="classic">
          <div class="avatar" id="avatar" aria-hidden="true">LW</div>
          <blockquote class="quote" id="quoteText" aria-live="polite">Loading a quote…</blockquote>
          <div class="divider"></div>
          <p class="author" id="quoteAuthor"></p>
          <div class="actions">
            <button id="favBtn" class="icon-btn fav-btn" type="button" aria-pressed="false" aria-label="Save to favorites">
              <svg class="ic"><use href="#i-heart"/></svg>
            </button>
            <button id="copyBtn" class="icon-btn" type="button" aria-label="Copy quote">
              <svg class="ic"><use href="#i-copy"/></svg>
            </button>
            <button id="imgBtn" class="icon-btn" type="button" aria-label="Download quote as image">
              <svg class="ic"><use href="#i-download"/></svg>
            </button>
            <button id="shareBtn" class="icon-btn" type="button" aria-label="Share quote">
              <svg class="ic"><use href="#i-share"/></svg>
            </button>
            <button id="speakBtn" class="icon-btn" type="button" aria-label="Read quote aloud">
              <svg class="ic"><use href="#i-volume"/></svg>
            </button>
          </div>
        </article>

        <button id="newBtn" class="btn-primary" type="button">
          <svg class="ic"><use href="#i-refresh"/></svg>New Quote
        </button>

        <div class="themes">
          <span class="themes-label" id="themesLabel">Card style</span>
          <div class="swatches" id="themes" role="group" aria-labelledby="themesLabel"></div>
        </div>
      </section>

      <section id="view-add" class="view" aria-label="Add your own quote">
        <h2 class="view-title">Add your own quote</h2>
        <form id="addForm" novalidate>
          <label for="inText">Quote</label>
          <textarea id="inText" rows="4" maxlength="220" placeholder="Write something worth remembering"></textarea>
          <p class="error" id="errText" role="alert"></p>

          <label for="inAuthor">Author</label>
          <input id="inAuthor" type="text" maxlength="60" placeholder="Maya Angelou" autocomplete="off">

          <label for="inCat">Category</label>
          <select id="inCat"></select>

          <button class="btn-primary" type="submit">Save quote</button>
        </form>

        <h2 class="view-title sub">Your quotes</h2>
        <div id="myList" class="list"></div>
      </section>

      <section id="view-favs" class="view" aria-label="Favorites">
        <h2 class="view-title">Favorites</h2>
        <input id="favSearch" class="search" type="search" placeholder="Search favorites" aria-label="Search favorites" autocomplete="off">
        <div id="favList" class="list"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab is-active" type="button" data-view="home" aria-current="page">
        <svg class="ic"><use href="#i-home"/></svg><span>Home</span>
      </button>
      <button class="tab" type="button" data-view="add">
        <svg class="ic"><use href="#i-plus"/></svg><span>Add</span>
      </button>
      <button class="tab" type="button" data-view="favs">
        <svg class="ic"><use href="#i-bookmark"/></svg><span>Favorites</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
